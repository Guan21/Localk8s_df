apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: dify
spec:
  template:
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
      - name: worker
        env:
        - name: C_FORCE_ROOT
          value: "false"
        resources:
          requests:
            cpu: "500m"
            memory: "2Gi"
          limits:
            cpu: "1000m"
            memory: "4Gi"
        livenessProbe:
          initialDelaySeconds: 300
          periodSeconds: 120
          timeoutSeconds: 90
          failureThreshold: 3
        readinessProbe:
          initialDelaySeconds: 180
          periodSeconds: 90
          timeoutSeconds: 60
          failureThreshold: 3
