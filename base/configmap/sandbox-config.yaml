apiVersion: v1
kind: ConfigMap
metadata:
  name: sandbox-config
  namespace: dify
data:
  config.yaml: |
    # Sandbox設定ファイル
    server:
      port: 8194
      timeout: 15

    network:
      enable: true
      proxy:
        http: http://ssrf-proxy-svc:3128
        https: http://ssrf-proxy-svc:3128

    security:
      api_key: dify-sandbox
