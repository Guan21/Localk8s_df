apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-config
  namespace: dify
data:
  pg_hba.conf: |
    # TYPE  DATABASE        USER            ADDRESS                 METHOD
    local   all            postgres                                trust
    host    all            postgres         127.0.0.1/32          trust
    host    all            postgres         ::1/128               trust
    host    all            postgres         all                   md5
    host    all            all              all                   md5
