apiVersion: v1
kind: Service
metadata:
  name: plugin-daemon-svc
  namespace: dify
spec:
  selector:
    app: plugin-daemon
  ports:
    - name: http
      protocol: TCP
      port: 5002
      targetPort: 5002
    - name: remote
      protocol: TCP
      port: 5003
      targetPort: 5003
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: plugin-daemon
  namespace: dify
spec:
  replicas: 1
  selector:
    matchLabels:
      app: plugin-daemon
  template:
    metadata:
      labels:
        app: plugin-daemon
    spec:
      containers:
      - name: plugin-daemon
        image: langgenius/dify-plugin-daemon:0.0.9-local
        ports:
        - containerPort: 5002
        - containerPort: 5003
        env:
        - name: PORT
          value: "5002"
        - name: SERVER_KEY
          valueFrom:
            secretKeyRef:
              name: plugin-daemon-secret
              key: PLUGIN_DAEMON_KEY
        - name: DIFY_INNER_API_URL
          value: "http://api-svc:5001"
        - name: DIFY_INNER_API_KEY
          valueFrom:
            secretKeyRef:
              name: plugin-daemon-secret
              key: PLUGIN_DIFY_INNER_API_KEY
        - name: REDIS_HOST
          value: "redis-svc"
        - name: REDIS_PORT
          value: "6379"
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: redis-secret
              key: REDIS_PASSWORD
        - name: DB_USERNAME
          value: "postgres"
        - name: DB_PASSWORD
          value: "difyai123456"
        - name: DB_HOST
          value: "postgres-svc"
        - name: DB_PORT
          value: "5432"
        - name: DB_DATABASE
          value: "dify_plugin"
        - name: PLUGIN_STORAGE_TYPE
          value: "local"
        - name: PLUGIN_STORAGE_LOCAL_ROOT
          value: "/app/storage"
        - name: PLUGIN_WORKING_PATH
          value: "/app/storage/cwd"
        - name: PLUGIN_INSTALLED_PATH
          value: "plugin"
        - name: PLUGIN_PACKAGE_CACHE_PATH
          value: "plugin_packages"
        - name: PLUGIN_MEDIA_CACHE_PATH
          value: "assets"
        - name: PLUGIN_REMOTE_INSTALLING_HOST
          value: "0.0.0.0"
        - name: PLUGIN_REMOTE_INSTALLING_PORT
          value: "5003"
        - name: MARKETPLACE_ENABLED
          value: "true"
        - name: MARKETPLACE_API_URL
          value: "https://marketplace.dify.ai"
        - name: FORCE_VERIFYING_SIGNATURE
          value: "true"
        - name: PLUGIN_PYTHON_ENV_INIT_TIMEOUT
          value: "120"
        - name: PLUGIN_MAX_EXECUTION_TIMEOUT
          value: "600"
        envFrom:
        - secretRef:
            name: plugin-daemon-secret
        resources:
          requests:
            cpu: "200m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        livenessProbe:
          httpGet:
            path: /health/check
            port: 5002
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /health/check
            port: 5002
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
        volumeMounts:
        - name: plugin-storage
          mountPath: /app/storage
      volumes:
      - name: plugin-storage
        persistentVolumeClaim:
          claimName: plugin-storage
