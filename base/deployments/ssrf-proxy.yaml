apiVersion: v1
kind: ConfigMap
metadata:
  name: squid-config
  namespace: dify
data:
  squid.conf: |
    http_port 3128

    # Access Control Lists (ACLs)
    acl SSL_ports port 443
    acl Safe_ports port 80          # http
    acl Safe_ports port 443         # https
    acl Safe_ports port 8080        # alternative http
    acl Safe_ports port 8443        # alternative https
    acl CONNECT method CONNECT

    # Access Rules
    http_access allow localhost
    http_access deny !Safe_ports
    http_access deny CONNECT !SSL_ports
    http_access allow all

    coredump_dir /var/spool/squid
---
apiVersion: v1
kind: Service
metadata:
  name: ssrf-proxy-svc
  namespace: dify
spec:
  selector:
    app: ssrf-proxy
  ports:
    - protocol: TCP
      port: 3128
      targetPort: 3128
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ssrf-proxy
  namespace: dify
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ssrf-proxy
  template:
    metadata:
      labels:
        app: ssrf-proxy
    spec:
      containers:
      - name: ssrf-proxy
        image: ubuntu/squid:latest
        ports:
        - containerPort: 3128
        env:
        # プロキシサーバー設定
        - name: HTTP_PORT
          value: "3128"
        - name: COREDUMP_DIR
          value: "/var/spool/squid"
        
        # リバースプロキシ設定
        - name: REVERSE_PROXY_PORT
          value: "8194"
        - name: SANDBOX_HOST
          value: "sandbox"
        - name: SANDBOX_PORT
          value: "8194"

        # タイムアウト設定
        - name: DEFAULT_TIME_OUT
          value: "5"
        - name: DEFAULT_CONNECT_TIME_OUT
          value: "5"
        - name: DEFAULT_READ_TIME_OUT
          value: "5"
        - name: DEFAULT_WRITE_TIME_OUT
          value: "5"

        # SSRF_接頭辞付き設定
        - name: SSRF_HTTP_PORT
          value: "3128"
        - name: SSRF_COREDUMP_DIR
          value: "/var/spool/squid"
        - name: SSRF_REVERSE_PROXY_PORT
          value: "8194"
        - name: SSRF_SANDBOX_HOST
          value: "sandbox"
        - name: SSRF_DEFAULT_TIME_OUT
          value: "5"
        - name: SSRF_DEFAULT_CONNECT_TIME_OUT
          value: "5"
        - name: SSRF_DEFAULT_READ_TIME_OUT
          value: "5"
        - name: SSRF_DEFAULT_WRITE_TIME_OUT
          value: "5"
        volumeMounts:
        - name: squid-config
          mountPath: /etc/squid/squid.conf
          subPath: squid.conf
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "200m"
            memory: "256Mi"
        livenessProbe:
          tcpSocket:
            port: 3128
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
        readinessProbe:
          tcpSocket:
            port: 3128
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
      volumes:
      - name: squid-config
        configMap:
          name: squid-config
