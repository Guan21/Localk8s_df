apiVersion: v1
kind: ConfigMap
metadata:
  name: squid-config
  namespace: dify
data:
  squid.conf: |
    http_port 3128
    acl SSL_ports port 443
    acl CONNECT method CONNECT
    http_access allow localhost
    http_access deny !Safe_ports
    http_access deny CONNECT !SSL_ports
    http_access allow all
    coredump_dir /var/spool/squid
---
apiVersion: v1
kind: Service
metadata:
  name: ssrf-proxy-svc
  namespace: dify
spec:
  selector:
    app: ssrf-proxy
  ports:
    - protocol: TCP
      port: 3128
      targetPort: 3128
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ssrf-proxy
  namespace: dify
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ssrf-proxy
  template:
    metadata:
      labels:
        app: ssrf-proxy
    spec:
      containers:
      - name: ssrf-proxy
        image: ubuntu/squid:latest
        ports:
        - containerPort: 3128
        env:
        - name: HTTP_PORT
          value: "3128"
        - name: COREDUMP_DIR
          value: "/var/spool/squid"
        volumeMounts:
        - name: squid-config
          mountPath: /etc/squid/squid.conf
          subPath: squid.conf
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "200m"
            memory: "256Mi"
        livenessProbe:
          tcpSocket:
            port: 3128
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
        readinessProbe:
          tcpSocket:
            port: 3128
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
      volumes:
      - name: squid-config
        configMap:
          name: squid-config
