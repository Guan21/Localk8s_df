apiVersion: v1
kind: ConfigMap
metadata:
  name: squid-config
  namespace: dify
data:
  squid.conf: |
    http_port 3128
    
    # ACLs for routing
    acl web_services dstdomain web-svc.dify.svc.cluster.local
    acl api_services dstdomain api-svc.dify.svc.cluster.local
    acl internal_services dstdomain .dify.svc.cluster.local
    
    # Ports
    acl web_ports port 3000
    acl api_ports port 5001
    
    # Access rules
    http_access allow web_services
    http_access allow api_services
    http_access allow internal_services
    
    # Cache peer configuration
    cache_peer web-svc.dify.svc.cluster.local parent 3000 0 no-query originserver name=web
    cache_peer api-svc.dify.svc.cluster.local parent 5001 0 no-query originserver name=api

    # Basic configurations
    coredump_dir /var/spool/squid
    cache_dir ufs /var/spool/squid 100 16 256
---
apiVersion: v1
kind: Service
metadata:
  name: ssrf-proxy-svc
  namespace: dify
spec:
  ports:
    - port: 3128
      targetPort: 3128
  selector:
    app: ssrf-proxy
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ssrf-proxy
  namespace: dify
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ssrf-proxy
  template:
    metadata:
      labels:
        app: ssrf-proxy
    spec:
      containers:
      - name: ssrf-proxy
        image: ubuntu/squid:latest
        ports:
        - containerPort: 3128
        resources:
          requests:
            cpu: "200m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        volumeMounts:
        - name: squid-config
          mountPath: /etc/squid/squid.conf
          subPath: squid.conf
        livenessProbe:
          tcpSocket:
            port: 3128
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          tcpSocket:
            port: 3128
          initialDelaySeconds: 5
          periodSeconds: 10
      volumes:
      - name: squid-config
        configMap:
          name: squid-config
