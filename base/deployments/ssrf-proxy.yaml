apiVersion: v1
kind: ConfigMap
metadata:
  name: squid-config
  namespace: dify
data:
  squid.conf: |
    http_port 3128
    
    # Define safe ports
    acl Safe_ports port 80          # http
    acl Safe_ports port 443         # https
    acl Safe_ports port 21          # ftp
    acl SSL_ports port 443          # https
    
    # Define request methods
    acl CONNECT method CONNECT
    
    # Access controls
    http_access allow localhost
    http_access deny !Safe_ports    # deny access to non-safe ports
    http_access deny CONNECT !SSL_ports  # deny CONNECT to non-SSL ports
    
    # Only allow specific methods and ports to external services
    acl allowed_domains dstdomain .openai.com .dify.ai
    http_access allow allowed_domains
    http_access deny all  # deny everything else
    
    # Basic settings
    coredump_dir /var/spool/squid
    cache_mem 256 MB
    maximum_object_size 32 MB
---
apiVersion: v1
kind: Service
metadata:
  name: ssrf-proxy-svc
  namespace: dify
spec:
  selector:
    app: ssrf-proxy
  ports:
    - protocol: TCP
      port: 3128
      targetPort: 3128
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ssrf-proxy
  namespace: dify
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ssrf-proxy
  template:
    metadata:
      labels:
        app: ssrf-proxy
    spec:
      containers:
      - name: ssrf-proxy
        image: ubuntu/squid:5.2-22.04_beta
        securityContext:
          runAsUser: 13
          fsGroup: 13
        ports:
        - containerPort: 3128
        env:
        - name: HTTP_PORT
          value: "3128"
        - name: COREDUMP_DIR
          value: "/var/spool/squid"
        volumeMounts:
        - name: squid-config
          mountPath: /etc/squid/squid.conf
          subPath: squid.conf
        - name: squid-cache
          mountPath: /var/spool/squid
        resources:
          requests:
            cpu: "200m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        livenessProbe:
          tcpSocket:
            port: 3128
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
        readinessProbe:
          tcpSocket:
            port: 3128
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
      volumes:
      - name: squid-config
        configMap:
          name: squid-config
      - name: squid-cache
        emptyDir: {}
