apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: dify
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      initContainers:
      - name: wait-for-postgres
        image: busybox
        command: ['sh', '-c', 'until nc -z postgres-svc 5432; do echo waiting for postgres; sleep 2; done']
      containers:
      - name: worker
        image: langgenius/dify-api:1.3.1
        env:
        - name: MODE
          value: "worker"
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: redis-secret
              key: REDIS_PASSWORD
        - name: CELERY_BROKER_URL
          value: "redis://:$(REDIS_PASSWORD)@redis-svc:6379/1"
        - name: CELERY_CONCURRENCY
          value: "4"
        envFrom:
        - configMapRef:
            name: shared-config
        volumeMounts:
        - name: app-storage
          mountPath: /app/api/storage
        resources:
          requests:
            cpu: "500m"
            memory: "2Gi"
          limits:
            cpu: "1000m"
            memory: "4Gi"
        livenessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - celery -A app.celery inspect ping -d celery@$HOSTNAME
          initialDelaySeconds: 180
          periodSeconds: 90
          timeoutSeconds: 60
          failureThreshold: 8
          successThreshold: 1
        readinessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - celery -A app.celery inspect ping -d celery@$HOSTNAME
          initialDelaySeconds: 120
          periodSeconds: 60
          timeoutSeconds: 60
          failureThreshold: 8
          successThreshold: 1
      volumes:
      - name: app-storage
        persistentVolumeClaim:
          claimName: app-storage
