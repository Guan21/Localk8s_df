apiVersion: v1
kind: Service
metadata:
  name: sandbox-svc
  namespace: dify
spec:
  selector:
    app: sandbox
  ports:
    - protocol: TCP
      port: 8194
      targetPort: 8194
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sandbox
  namespace: dify
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sandbox
  template:
    metadata:
      labels:
        app: sandbox
    spec:
      containers:
      - name: sandbox
        image: langgenius/dify-sandbox:0.2.11
        ports:
        - containerPort: 8194
        env:
        - name: API_KEY
          value: "dify-sandbox"
        - name: GIN_MODE
          value: "release"
        - name: WORKER_TIMEOUT
          value: "15"
        - name: ENABLE_NETWORK
          value: "true"
        - name: HTTP_PROXY
          value: "http://ssrf-proxy-svc:3128"
        - name: HTTPS_PROXY
          value: "http://ssrf-proxy-svc:3128"
        - name: SANDBOX_PORT
          value: "8194"
        volumeMounts:
        - name: dependencies
          mountPath: /dependencies
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "200m"
            memory: "512Mi"
        livenessProbe:
          httpGet:
            path: /health
            port: 8194
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /health
            port: 8194
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
      volumes:
      - name: dependencies
        emptyDir: {}
