apiVersion: v1
kind: Service
metadata:
  name: web-svc
  namespace: dify
spec:
  selector:
    app: web
  ports:
    - protocol: TCP
      port: 3000
      targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: dify
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
      - name: web
        image: langgenius/dify-web:0.12.1
        ports:
        - containerPort: 3000
        env:
        - name: CONSOLE_API_URL
          valueFrom:
            configMapKeyRef:
              name: shared-config
              key: CONSOLE_API_URL
        - name: APP_API_URL
          value: "http://api-svc:5001"
        - name: NEXT_TELEMETRY_DISABLED
          value: "1"
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "200m"
            memory: "512Mi"
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 180
          periodSeconds: 10
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
