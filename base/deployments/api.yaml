apiVersion: v1
kind: Service
metadata:
  name: api-svc
  namespace: dify
spec:
  type: NodePort
  selector:
    app: api
  ports:
    - protocol: TCP
      port: 5001
      targetPort: 5001
      nodePort: 30081
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: dify
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      initContainers:
      - name: wait-for-postgres
        image: postgres:15-alpine
        env:
        - name: PGUSER
          value: "postgres"
        - name: PGPASSWORD
          value: "difyai123456"
        command: ['sh', '-c', 'until pg_isready -h postgres-svc -p 5432; do echo waiting for postgres; sleep 2; done']
      containers:
      - name: api
        image: langgenius/dify-api:1.3.1
        ports:
        - containerPort: 5001
        env:
        - name: MODE
          value: "api"
        - name: CELERY_BEAT_SCHEDULER_TIME
          value: "1"
        envFrom:
        - configMapRef:
            name: shared-config
        - secretRef:
            name: redis-secret
        - secretRef:
            name: plugin-daemon-secret
        - secretRef:
            name: model-provider-secret
        - secretRef:
            name: mail-secret
        volumeMounts:
        - name: app-storage
          mountPath: /app/api/storage
        resources:
          requests:
            cpu: "200m"
            memory: "512Mi"
          limits:
            cpu: "1000m"
            memory: "2Gi"
        livenessProbe:
          httpGet:
            path: /health
            port: 5001
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /health
            port: 5001
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
      volumes:
      - name: app-storage
        persistentVolumeClaim:
          claimName: app-storage
