apiVersion: v1
kind: Service
metadata:
  name: api-svc
  namespace: dify
spec:
  selector:
    app: api
  ports:
    - protocol: TCP
      port: 5001
      targetPort: 5001
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: dify
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
      - name: api
        image: langgenius/dify-api:0.12.1
        ports:
        - containerPort: 5001
        env:
        - name: MODE
          value: "api"
        envFrom:
        - configMapRef:
            name: shared-config
        - secretRef:
            name: db-secret
        - secretRef:
            name: redis-secret
        volumeMounts:
        - name: app-storage
          mountPath: /app/api/storage
        resources:
          requests:
            cpu: "200m"
            memory: "512Mi"
          limits:
            cpu: "500m"
            memory: "1Gi"
        livenessProbe:
          httpGet:
            path: /health
            port: 5001
          initialDelaySeconds: 120
          periodSeconds: 10
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /health
            port: 5001
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
      volumes:
      - name: app-storage
        persistentVolumeClaim:
          claimName: app-storage
